name: Ubuntu installer smoke
on:
  workflow_call:
    inputs:
      release_tag:
        description: Leave empty to test artifacts from the calling build
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published desktop release tag to install and test
        required: true
        default: desktop-preview-v0.1.0-r4
        type: string
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download and verify the released Ubuntu installer
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir installer
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*linux-$ARCH.deb" --pattern '*SHA256SUMS*' --dir installer
      - name: Download the installer built in this workflow
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v8
        with:
          name: injoffice-linux-${{ matrix.arch }}
          path: installer
      - name: Verify checksum and CPU architecture
        working-directory: installer
        run: |
          cat *SHA256SUMS* | sha256sum --ignore-missing --check
          test "$(dpkg-deb --field ./*.deb Architecture)" = "$(dpkg --print-architecture)"
      - name: Install the DEB through APT
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y ./installer/*.deb
          dpkg-query -W -f='${Status}\n' injoffice
          ldd /opt/InjOffice/injoffice
      - name: Launch the installed app and create a spreadsheet
        timeout-minutes: 4
        run: xvfb-run --auto-servernum node scripts/smoke-desktop-linux.mjs
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: desktop-smoke-output/
          if-no-files-found: ignore
