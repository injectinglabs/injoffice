name: Desktop release draft
on:
  workflow_dispatch:
    inputs:
      mac_signing:
        description: 'macOS signing. Unsigned ships a Gatekeeper-warning build whose updates download a DMG; choose it only while no Developer ID exists.'
        type: choice
        default: signed
        options: [signed, unsigned]
      platforms:
        description: 'Platforms to ship. Leaving one out is deliberate: its signing identity is not in place yet.'
        type: choice
        default: mac,windows,linux
        options:
          - mac,windows,linux
          - windows,linux
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A job-level `if` cannot see the matrix context, so the platform set decides the matrix itself.
  # A platform outside the input never becomes a leg and cannot contribute assets.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          legs = {
            'mac': {'os': 'macos-latest', 'platform': 'mac', 'args': '--mac --arm64 --x64'},
            'windows': {'os': 'windows-latest', 'platform': 'windows', 'args': '--win --x64'},
            'linux': {'os': 'ubuntu-latest', 'platform': 'linux', 'args': '--linux --x64'},
          }
          wanted = [name.strip() for name in os.environ['PLATFORMS'].split(',') if name.strip()]
          unknown = [name for name in wanted if name not in legs]
          if unknown or not wanted:
              raise SystemExit(f'refusing: unknown or empty platform set {os.environ["PLATFORMS"]!r}')
          print('matrix=' + json.dumps({'include': [legs[name] for name in wanted]}))
          PY

  # Windows runners cannot execute the engines' POSIX build scripts, so the wasm engines are
  # built once on Linux and shared, the same way .github/workflows/desktop.yml does it.
  engines:
    name: native engines (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/xlsxpatch/go.mod
          cache: false
      - name: Cache the Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-wasm-${{ hashFiles('go/*/go.mod', 'go/*/go.sum', 'go/**/*.go') }}
          restore-keys: ${{ runner.os }}-go-build-wasm-
      - run: npm ci
      - name: Build the WASM engines and their workspace dependencies
        run: npm run build -w @injoffice/docx-wasm -w @injoffice/xlsx-wasm -w @injoffice/pptx-wasm
      - name: Prove the built engines extract a blank document
        run: npm run test:native -w @injoffice/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: native-engines
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [plan, engines]
    environment: desktop-release
    strategy:
      fail-fast: false
      # One Mac invocation merges both architectures into latest-mac.yml; see the plan job.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      # Windows signs through Azure Artifact Signing: account identifiers are repository
      # variables (not secret), the Entra application is a secret, and Azure.Identity reads
      # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET itself.
      AZURE_SIGNING_ENDPOINT: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ENDPOINT || '' }}
      AZURE_SIGNING_ACCOUNT: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_ACCOUNT || '' }}
      AZURE_SIGNING_CERT_PROFILE: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_CERT_PROFILE || '' }}
      AZURE_SIGNING_PUBLISHER_NAME: ${{ matrix.platform == 'windows' && vars.AZURE_SIGNING_PUBLISHER_NAME || '' }}
      AZURE_TENANT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and signing credentials
        # Declared per run. Scoped to the steps that act on it, so the workspace tests keep
        # checking the signed configuration they are written against.
        env:
          INJOFFICE_MAC_UNSIGNED: ${{ inputs.mac_signing == 'unsigned' && '1' || '' }}
        run: node apps/desktop/scripts/release-validation.mjs preflight ${{ matrix.platform }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/xlsxpatch/go.mod
          cache: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools desktop-file-utils appstream
      - run: npm ci
      - run: node --test apps/desktop/tests/release-validation.test.mjs
      - name: Use the engines built by the engines job
        uses: actions/download-artifact@v8
        with:
          name: native-engines
          path: packages
      - name: Prove the transferred engines work on this runner
        run: npm run test:native -w @injoffice/desktop
      - name: Build the renderer from the built engines
        # The workspace prebuild would rebuild the engines with Go, which Windows runners
        # cannot do; they come from the engines job instead.
        working-directory: apps/desktop
        run: npx vite build
      - run: npm run test -w @injoffice/desktop
      - run: npm run test:native -w @injoffice/desktop
      - run: npm run typecheck -w @injoffice/desktop
      - name: Package signed release installers and update metadata
        working-directory: apps/desktop
        env:
          INJOFFICE_MAC_UNSIGNED: ${{ inputs.mac_signing == 'unsigned' && '1' || '' }}
        run: npx electron-builder --config electron-builder.release.cjs ${{ matrix.args }} --publish never
      - name: Verify packaged host, renderer and native engines
        run: npm run test:packaged -w @injoffice/desktop
      - name: Verify Linux installer metadata and icons
        if: runner.os == 'Linux'
        run: node apps/desktop/scripts/check-linux-packages.cjs
      - name: Verify notarized Mac applications
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict apps/desktop/release/mac-arm64/InjOffice.app
          codesign --verify --deep --strict apps/desktop/release/mac/InjOffice.app
          xcrun stapler validate apps/desktop/release/mac-arm64/InjOffice.app
          xcrun stapler validate apps/desktop/release/mac/InjOffice.app
      - name: Verify updater dependencies inside packaged applications
        run: node apps/desktop/scripts/check-packaged-updater.cjs apps/desktop/release --release
      - name: Verify Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem apps/desktop/release/*.exe
          if (!$installers) { throw 'No Windows installers produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($installer.Name)" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          path: release-assets
      - run: npm ci --ignore-scripts
      - name: Validate complete asset set and generate checksums
        run: node apps/desktop/scripts/release-validation.mjs collect release-assets '${{ inputs.platforms }}'
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          # Refuse to replace existing releases or mutate a live update feed on reruns.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists. Review it manually; this workflow will not overwrite it.' >&2
            exit 1
          fi
          title="InjOffice ${GITHUB_REF_NAME#desktop-v}"
          # A release shipping a subset says so in its title, so nobody infers it from missing files.
          if [ "$PLATFORMS" != 'mac,windows,linux' ]; then title="$title ($PLATFORMS only)"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$title" --generate-notes
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME"
